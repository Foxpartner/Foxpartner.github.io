# Publishes the website on GitHub Pages and updates the catalog every day at 14:00 (Brasilia time).
name: Update catalog & publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 17 * * *'   # 17:00 UTC = 14:00 in Brazil
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Look for new reactions on YouTube and Patreon
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\update-catalog.ps1
      - name: Save changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain catalogo.csv data/catalog.js assets/thumbs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalogo.csv data/catalog.js assets/thumbs
            git commit -m "Daily catalog update"
            git push
          else
            echo "Nothing new."
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Collect website files
        run: |
          mkdir _site
          cp -r index.html assets data _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
